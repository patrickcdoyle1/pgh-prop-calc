<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Property Tax Calculator</title>
    <style>
        /* ... (styles remain the same) ... */
        body { font-family: Arial, sans-serif; margin: 20px; }
        .calculator { border: 1px solid #ccc; padding: 20px; width: 300px; box-shadow: 2px 2px 5px rgba(0,0,0,0.1); }
        input[type="number"], select, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        .result { margin-top: 20px; padding: 10px; background-color: #f2f2f2; border: 1px solid #ddd; }
        .error { color: red; }
    </style>
</head>
<body>

    <h1>Property Tax Calculator</h1>

    <div class="calculator">
        <form method="POST">
            <label for="num1">Assessed Propety Value ($):</label>
            <input type="number" step="any" name="num1" id="num1" required>

            <div class="checkbox-container">
                <input 
                    type="checkbox" 
                    id="homestead" 
                    name="homestead" 
                    value="yes"
                    {% if homestead_status == 'yes' %}checked{% endif %}>
                <label for="homestead">Apply Homestead Exemption ($18,000)</label>
            </div>
            <button type="submit">Calculate</button>
        </form>

        {% if error %}
            <div class="result error">
                <p><strong>{{ error }}</strong></p>
            </div>
        {% elif result is not none %}
            <div class="result">
                <p><strong>Estimated Annual Tax:</strong> ${{ "%.2f"|format(result) }}</p>
            </div>
        {% endif %}
    </div>

</body>
</html>
